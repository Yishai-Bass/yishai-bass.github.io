    <link rel="canonical" href="https://orderup-e241e.web.app/manager/" />
    <script>
      (function () {
        var suffix = window.location.pathname.replace(/^\/(?:merchant|manager)(?=\/|$)/, '');
        if (suffix === '/index.html') suffix = '/';
        var destination = new URL('/manager' + (suffix || '/'), 'https://orderup-e241e.web.app');
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.href);
      })();
    </script>
    <meta http-equiv="refresh" content="2;url=https://orderup-e241e.web.app/manager/" />
  </head>
